<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DREAMBROAD Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Operations Workspace</p>
          <h1>DREAMBROAD</h1>
        </div>
        <i data-lucide="shield-check"></i>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack inline-flashes" aria-live="polite">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form class="auth-form" method="post" action="{{ url_for('login_post', next=request.args.get('next', '')) }}">
        <label>
          <span>Username</span>
          <input name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary full" type="submit">
          <i data-lucide="log-in"></i>
          Log In
        </button>
      </form>
    </section>
  </main>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
